<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Père Noël secret</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------
   Design tokens: a night-time palette. Deep blue-black ground, warm ivory
   ink, and one accent: champagne gold (selection, primary action). Cranberry
   means imposed or destructive, pine means valid, copper means "soft".
   The simulation matrix is drawn like a Nordic knitting chart, in frost blue
   so that it never competes with the gold chrome.
------------------------------------------------------------------- */
:root {
  color-scheme: dark;
  --night: #0E1220;  --paper: #161B2E;  --raised: #1D2340;  --sunken: #0B0F1C;
  --line: #2C3454;   --line-hi: #3C4670;  --line-soft: #1F2542;
  --ink: #EDE8DC;    --ink-2: #B3B7C8;   --ink-3: #8C93AA;
  --accent: #D6B573; --accent-hover: #E7CB93; --accent-weak: rgba(214,181,115,.14); --on-accent: #17120A;
  --cran: #EE8399;   --cran-weak: rgba(238,131,153,.13); --cran-solid: #B02B4B;
  --pine: #74D0AB;   --pine-weak: rgba(116,208,171,.13); --pine-solid: #1F5C49;
  --straw: #EDAB68;  --straw-bg: rgba(237,171,104,.12); --straw-line: #E39C52;
  --frost: 143, 172, 240;
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Sitka Text", Cambria, Georgia, serif;
  --sans: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; font: 15px/1.5 var(--sans); color: var(--ink); min-height: 100vh;
  background: radial-gradient(1100px 420px at 50% -160px, #1B2247 0, rgba(27,34,71,0) 72%) no-repeat, var(--night); }
::selection { background: rgba(214,181,115,.35); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.top { background: rgba(14,18,32,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.bar { display: flex; align-items: center; gap: 16px; max-width: 1240px; margin: 0 auto; padding: 10px 32px 0; flex-wrap: wrap; }
.brand { padding-bottom: 8px; }
.brand .logo { font-size: .85em; margin-right: 2px; }
.brand h1 { font: 600 22px/1.15 var(--serif); letter-spacing: .01em; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 11px 11px; color: var(--ink-2); font-weight: 500; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[disabled] { opacity: .4; cursor: default; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--straw-line); }
.status { margin-left: auto; display: flex; align-items: center; gap: 12px; padding-bottom: 8px; }

/* ---------- buttons, inputs ---------- */
.btn { appearance: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-weight: 500; cursor: pointer; background: none; line-height: 1.3; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.primary:disabled { background: #4B4A43; color: #8D8A7C; cursor: default; }
.btn.line { border-color: var(--line-hi); background: var(--paper); }
.btn.line:hover { border-color: var(--accent); color: var(--accent-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { color: var(--ink-2); padding: 6px 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--line-soft); }
.btn.danger { color: var(--cran); }
.btn.danger:hover { background: var(--cran-weak); color: var(--cran); }
.btn.solid-danger { background: var(--cran-solid); color: #fff; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.in { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); padding: 8px 10px; }
.in:hover { border-color: var(--line-hi); }
.in:focus { border-color: var(--accent); outline: 2px solid var(--accent-weak); outline-offset: 0; }
.in::placeholder { color: #7C84A6; }
.in.bad { border-color: var(--cran); }
textarea.in { resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.pill { appearance: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--pine-weak); color: var(--pine); }
.pill.warn { background: var(--straw-bg); color: var(--straw); }
.pill.bad  { background: var(--cran-weak); color: var(--cran); }
.pill.idle { background: var(--line-soft); color: var(--ink-3); }
.saved-note { white-space: nowrap; color: var(--ink-3); font-size: 13px; }

/* ---------- page frame ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 34px 32px 80px; }
.page-head { margin-bottom: 26px; max-width: 70ch; }
.page-head h2 { font: 600 30px/1.15 var(--serif); display: inline-flex; align-items: center; gap: 12px; }
.page-head p { color: var(--ink-2); margin-top: 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.stack { display: grid; gap: 14px; }

/* ---------- participants ---------- */
.people { max-width: 860px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 150px auto; gap: 10px; align-items: center; padding: 6px 0; }
.prow .more { color: var(--ink-3); white-space: nowrap; text-align: right; overflow: hidden; text-overflow: ellipsis; }
.prow .more[aria-expanded="true"] { color: var(--accent); }
.prow .more.warn { color: var(--straw); }
.pmore { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 12px; padding: 4px 0 10px 14px; border-left: 2px solid var(--line); }
.nocontact { color: var(--straw); font-size: 13.5px; margin: 0 0 10px; }
.rowerr { grid-column: 1 / -1; color: var(--cran); font-size: 13px; margin: -2px 0 4px 2px; display: none; }
.rowerr.on { display: block; }
.people-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.count { font: 600 15px var(--serif); color: var(--ink-2); margin-bottom: 8px; }

/* ---------- rules ---------- */
.rules-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 44px; align-items: start; }
.rsec { padding: 22px 0 6px; border-top: 1px solid var(--line); }
.rsec:first-child { border-top: 0; padding-top: 0; }
.rsec-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.rsec h3 { font: 600 19px/1.3 var(--serif); }
.rsec .desc { color: var(--ink-2); font-size: 14px; margin-top: 2px; max-width: 62ch; }
 .rsec-actions { display: flex; gap: 6px; }
.send-sum { color: var(--ink-2); margin: -6px 0 22px; }
.send-sum b { color: var(--ink); font-weight: 600; }
.send-grid { display: grid; gap: 8px; max-width: 900px; }
.send-note { margin: 4px 0 6px; }
.dlist { display: grid; grid-template-columns: minmax(0, 1fr) 84px max-content; column-gap: 16px; }
.drow { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; gap: 8px 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.drow .who { display: grid; min-width: 0; }
.drow .who b { font-weight: 600; }
.drow .who span { color: var(--ink-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.drow .acts { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.drow a.btn { text-decoration: none; display: inline-block; }
.st { justify-self: start; font-size: 12.5px; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.st.good { background: var(--pine-weak); color: var(--pine); }
.st.bad { background: var(--cran-weak); color: var(--cran); cursor: help; }
.st.idle { background: var(--line-soft); color: var(--ink-2); }
.st.busy { background: var(--accent-weak); color: var(--accent); }
.drow .dlg-err.on { display: block; color: var(--cran); font-size: 13px; }
.empty-state { max-width: 440px; display: grid; gap: 8px; justify-items: start; margin-top: 10px; }
.rsec h3 { display: inline-flex; align-items: center; gap: 9px; }
.tip { position: relative; display: inline-flex; font-family: var(--sans); }
.qm { appearance: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-hi); background: var(--paper); color: var(--ink-3); font: 600 12px/1 var(--sans); cursor: help; padding: 0; display: inline-grid; place-items: center; }
.qm:hover, .qm:focus-visible, .tip.open .qm { color: var(--accent); border-color: var(--accent); }
.tipbox { display: none; position: absolute; z-index: 25; left: -6px; top: calc(100% + 8px); width: max-content; max-width: min(320px, 78vw); background: var(--raised); border: 1px solid var(--line-hi); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.55); padding: 10px 12px; color: var(--ink); font: 400 13.5px/1.5 var(--sans); }
.tip:hover .tipbox, .tip:focus-within .tipbox, .tip.open .tipbox { display: block; }
.rlist { margin: 12px 0 8px; display: grid; }
.rrow { display: flex; align-items: center; gap: 14px; padding: 10px 12px; margin: 0 -12px; border-radius: 10px; flex-wrap: wrap; }
.rrow:hover { background: var(--paper); }
.rdesc { flex: 1 1 320px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.rdesc .w { color: var(--ink-2); }
.rmeta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ract { display: flex; gap: 2px; }
.empty { color: var(--ink-3); font-size: 14px; padding: 6px 0 10px; }
.chip { background: var(--accent-weak); color: var(--accent-hover); border: 1px solid rgba(214,181,115,.22); border-radius: 999px; padding: 2px 11px; font-weight: 500; font-size: 14px; }
.chip.unknown { background: var(--cran-weak); color: var(--cran); text-decoration: underline wavy; }
.badge { border-radius: 5px; padding: 1px 8px; font-size: 12.5px; font-weight: 500; background: var(--line-soft); color: var(--ink-2); }
.badge.strong { background: var(--raised); color: var(--ink); }
.badge.soft { background: var(--straw-bg); color: var(--straw); }
.switch { display: flex; gap: 12px; align-items: flex-start; margin: 12px 0 8px; cursor: pointer; }
.switch input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
details.raw { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
details.raw summary { cursor: pointer; font-weight: 500; color: var(--ink-2); }
details.raw textarea { margin-top: 10px; min-height: 220px; font: 13px/1.5 var(--mono); }

.verdict { position: sticky; top: 112px; border-left: 4px solid var(--line); padding: 2px 0 2px 20px; display: grid; gap: 14px; }
.verdict.good { border-color: var(--pine); } .verdict.warn { border-color: var(--straw-line); }
.verdict.bad { border-color: var(--cran); }
.verdict h3 { font: 600 21px/1.25 var(--serif); }
.verdict ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.verdict .err { color: var(--cran); }
.verdict h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
table.compiled { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
table.compiled th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
table.compiled td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.verdict details summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }

/* ---------- simulation ---------- */
.simbar { display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: end; margin-bottom: 8px; }
.simbar .field { width: 150px; }
.progress { height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; margin: 14px 0 4px; max-width: 520px; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 36px; margin: 26px 0 22px; }
.fact b { display: block; font: 600 30px/1.1 var(--serif); }
.fact span { color: var(--ink-2); font-size: 14px; }
.note-line { max-width: 74ch; margin: 6px 0; }
.note-line.warn { color: var(--straw); }
.chart-wrap { overflow-x: auto; padding: 4px 0 10px; }
.chart { --cell: clamp(22px, calc(560px / var(--n)), 46px); display: grid; width: max-content;
  grid-template-columns: minmax(70px, max-content) repeat(var(--n), var(--cell)); gap: 2px; }
.chart .colhead { height: var(--head, 108px); display: flex; align-items: flex-end; justify-content: center; font-size: 12.5px; color: var(--ink-2); }
.chart .colhead span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; max-height: calc(var(--head, 108px) - 4px); overflow: hidden; text-overflow: ellipsis; }
.chart .rowhead { display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 13px; color: var(--ink-2); height: var(--cell); white-space: nowrap; }
.chart .corner { font-size: 12px; color: var(--ink-3); display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 8px 4px 0; }
.cell { height: var(--cell); border-radius: 4px; background: #1A2040; font-size: 12px; display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cell.self { background: transparent; box-shadow: inset 0 0 0 1px var(--line-soft); }
.cell.hard { background: #141A33 repeating-linear-gradient(45deg, rgba(237,232,220,.24) 0 1.5px, transparent 1.5px 6px); }
.cell.soft { background: var(--straw-bg) radial-gradient(circle, var(--straw-line) 1.3px, transparent 1.6px) 0 0 / 6px 6px; }
.cell.forced { background: var(--cran-solid); color: #fff; }
.cell.heat.soft-hit { box-shadow: inset 0 0 0 2px var(--straw-line); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--ink-2); margin-top: 10px; align-items: center; }
.legend .sw { display: inline-block; width: 18px; height: 18px; border-radius: 4px; vertical-align: -4px; margin-right: 6px; }
.ramp { background: linear-gradient(90deg, rgba(var(--frost),.12), rgba(var(--frost),1)); }
.privacy { color: var(--ink-3); font-size: 13px; max-width: 74ch; margin-top: 22px; }

/* ---------- message ---------- */
.msg-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.msg-grid textarea { min-height: 330px; font: 14px/1.6 var(--mono); }
.vars { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
.mail { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px rgba(0,0,0,.28); padding: 22px 26px; min-height: 330px; }
.mail .subj { font: 600 21px/1.3 var(--serif); padding-bottom: 12px; border-bottom: 1px solid var(--line-soft); margin-bottom: 14px; }
.mail .body { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
.mail .to { color: var(--ink-3); font-size: 13px; margin-bottom: 6px; }
.err-box { color: var(--cran); background: var(--cran-weak); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }

/* ---------- draw ---------- */
.draw-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 52px; align-items: start; }
.draw-grid h3 { font: 600 19px/1.3 var(--serif); margin-bottom: 4px; }
.banner { background: var(--straw-bg); border-left: 4px solid var(--straw-line); padding: 12px 16px; border-radius: 0 10px 10px 0; margin-bottom: 22px; color: var(--straw); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.banner span { flex: 1 1 260px; }
.runbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin: 14px 0; }
.runbar .field { width: 130px; }
.console { margin-top: 16px; border: 1px solid var(--line); background: var(--sunken); border-radius: 10px; padding: 12px 16px; display: grid; gap: 4px; font-size: 14px; }
.console .ln { display: flex; gap: 10px; }
.console .ln::before { content: ""; flex: 0 0 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--ink-3); }
.console .ok::before { background: var(--pine); } .console .error::before { background: var(--cran); }
.console .warn::before, .console .conflict::before { background: var(--straw-line); }
.console .hint { color: var(--ink-2); }
.console .preview { margin-left: 18px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--ink-2); white-space: pre-wrap; display: block; }
.console .preview::before { display: none; }
.next { margin-top: 12px; color: var(--ink-2); font-size: 14px; }
code { font: 13px var(--mono); background: var(--line-soft); padding: 1px 6px; border-radius: 4px; }
.hist { display: grid; margin-top: 10px; }
.hrow { display: flex; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.hrow .yr { font: 600 24px/1 var(--serif); min-width: 3.4ch; }
.hrow .info { flex: 1 1 200px; color: var(--ink-2); font-size: 14px; }
.hrow .info b { font-weight: 500; color: var(--ink); }

/* ---------- dialog + toasts ---------- */
dialog { border: 1px solid var(--line-hi); border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: 0 30px 80px rgba(0,0,0,.65); color: var(--ink); background: var(--raised); }
dialog.wide { width: min(640px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(5,7,16,.68); }
.dlg-in { padding: 26px 28px 22px; display: grid; gap: 16px; }
.dlg-in h2 { font: 600 22px/1.25 var(--serif); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.form-grid { display: grid; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { appearance: none; border: 1px solid var(--line-hi); background: var(--paper); border-radius: 999px; padding: 4px 13px; cursor: pointer; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dlg-in details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.dlg-in details summary { cursor: pointer; font-weight: 500; }
.dlg-in details .form-grid { margin-top: 12px; }
.help { color: var(--ink-3); font-size: 13px; font-weight: 400; }
.dlg-err { color: var(--cran); font-size: 14px; min-height: 0; }
#toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 40px)); }
.toast { background: var(--raised); color: var(--ink); border: 1px solid var(--line-hi); border-radius: 10px; padding: 11px 16px; box-shadow: 0 12px 32px rgba(0,0,0,.5); font-size: 14px; }
.toast.error { background: var(--cran-solid); border-color: transparent; color: #fff; }
.toast.good { background: var(--pine-solid); border-color: transparent; color: #fff; }

/* ---------- set switcher ---------- */
.setwrap { position: relative; padding-bottom: 8px; }
.setbtn { appearance: none; display: inline-flex; align-items: center; gap: 10px; text-align: left; background: var(--paper); border: 1px solid var(--line-hi); border-radius: 12px; padding: 5px 12px 5px 14px; cursor: pointer; max-width: 300px; }
.setbtn:hover, .setbtn[aria-expanded="true"] { border-color: var(--accent); }
.setbtn .t { display: grid; line-height: 1.2; min-width: 0; }
.setbtn .k { font-size: 11.5px; color: var(--ink-3); }
.setbtn .v { font: 600 15px var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.setbtn svg { flex: none; color: var(--accent); }
.menu { position: absolute; left: 0; top: calc(100% - 4px); z-index: 30; min-width: 320px; max-width: min(420px, 92vw); background: var(--raised); border: 1px solid var(--line-hi); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.6); padding: 6px; }
.mi { appearance: none; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 9px; padding: 8px 10px; cursor: pointer; }
.mi:hover, .mi:focus-visible { background: var(--accent-weak); outline: none; }
.mi .ck { color: var(--accent); font-weight: 700; }
.mi .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi .meta { grid-column: 2; font-size: 12.5px; color: var(--ink-3); }
.bar { position: relative; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.mi.act { grid-template-columns: minmax(0, 1fr); color: var(--accent-hover); font-weight: 500; }

/* ---------- set manager + welcome ---------- */
.setlist { display: grid; gap: 2px; max-height: min(52vh, 420px); overflow: auto; margin: 0 -8px; padding: 0 8px; }
.srow { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.srow .who { flex: 1 1 220px; min-width: 0; }
.srow .who b { font: 600 17px var(--serif); display: block; overflow: hidden; text-overflow: ellipsis; }
.srow .who span { color: var(--ink-3); font-size: 13px; }
.srow .cur { font-size: 12.5px; color: var(--accent); border: 1px solid rgba(214,181,115,.4); border-radius: 999px; padding: 1px 9px; }

@media (max-width: 980px) {

  .verdict { position: static; order: -1; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<header class="top">
  <div class="bar">
    <div class="brand"><h1><span class="logo" aria-hidden="true">🎁</span> Père Noël secret</h1></div>
    <div class="setwrap" id="setwrap"></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <div class="status" id="status"></div>
  </div>
</header>
<main id="panel" role="tabpanel" aria-live="off"></main>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";

/* ================================================================
   Helpers
================================================================ */
const $ = (sel, root = document) => root.querySelector(sel);

/** Tiny DOM builder. Text goes through createTextNode, never innerHTML,
    so names read from the files can't inject markup. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false));
  return el;
}
const clone = x => JSON.parse(JSON.stringify(x));
const s = n => (n > 1 ? "s" : "");           // French plural: 0 and 1 are singular
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

async function api(path, body) {
  const headers = { "X-Santa-Token": TOKEN };
  if (S.setId && !path.startsWith("/api/sets") && !path.startsWith("/api/sms")) headers["X-Santa-Set"] = encodeURIComponent(S.setId);
  const opts = body === undefined
    ? { headers }
    : { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body) };
  try {
    const r = await fetch(path, opts);
    const data = await r.json().catch(() => ({ ok: false, error: "Réponse illisible du serveur." }));
    if (!r.ok && data.ok === undefined) data.ok = false;
    data._status = r.status;
    return data;
  } catch (e) {
    return { ok: false, error: "Le serveur ne répond plus. Relancez webui.py puis rechargez la page." };
  }
}

function toast(msg, kind = "") {
  const t = h("div", { class: "toast " + kind }, msg);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "error" ? 9000 : 4200);
}

/** Shared modal. Resolves with the chosen action's value (undefined on Escape).
    An action's onClick may return false to keep the dialog open.
    Each call builds its own <dialog>, so one can open on top of another. */
let dlgSeq = 0;
function openDialog({ title, content, actions, wide = false }) {
  return new Promise(resolve => {
    const id = "dlgTitle" + ++dlgSeq;
    const bar = h("div", { class: "dlg-actions" });
    const dlg = h("dialog", { class: wide ? "wide" : "", "aria-labelledby": id },
      h("div", { class: "dlg-in" }, h("h2", { id }, title), content, bar));
    let result;
    dlg.addEventListener("close", () => { dlg.remove(); resolve(result); });
    for (const a of actions) {
      bar.append(h("button", { type: "button", class: "btn " + (a.kind || "ghost"), onclick: async () => {
        if (a.onClick && (await a.onClick()) === false) return;
        result = a.value; dlg.close();
      } }, a.label));
    }
    document.body.append(dlg);
    dlg.showModal();
    const first = dlg.querySelector("input:not([type=checkbox]):not([type=radio]), select, textarea");
    if (first) first.focus();
  });
}
const confirmDialog = ({ title, text, label, danger }) => openDialog({
  title, content: h("p", {}, text),
  actions: [{ label: "Annuler", value: false }, { label, kind: danger ? "solid-danger" : "primary", value: true }],
}).then(v => v === true);

/* ================================================================
   State
================================================================ */
const TABS = [["participants", "Participants"], ["rules", "Règles"], ["sim", "Simulation"], ["message", "Message"], ["draw", "Tirage"], ["send", "Envoi"]];
const KNOWN_RULE_KEYS = ["forbidden", "forced", "couples", "groups", "history", "settings"];

const S = {
  tab: "rules", year: new Date().getFullYear(), setId: null, sets: [], epoch: 0, root: "",
  defaults: { priority: { force: 100, forbid: 50, history: 10 }, variables: ["santa", "recipient", "year"] },
  participants: [],            // { id, name, email, phone, messenger, other, prefer, prev, more }  (prev = name as last committed, for renames; more = extra contacts open)
  rules: normalizeRules({}),
  template: "", templateExists: true,
  saved: { p: "", r: "", t: "" },
  history: [],
  validation: null,
  sim: { running: false, stop: false, total: 100, agg: null, error: null },
  draw: { busy: false, lines: null, kind: null, ok: null },
  send: { busy: false, stop: false, items: null, mailReady: true, smsReady: false, year: null, reason: "", errors: {}, now: null },
  preview: null,
};

/* ---------- rules: raw JSON <-> editable form ---------- */
function normalizeRules(raw) {
  raw = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  const r = { extra: {} };
  for (const k of Object.keys(raw)) if (!KNOWN_RULE_KEYS.includes(k)) r.extra[k] = raw[k];
  const pairs = a => (Array.isArray(a) ? a : []).map(x => ({ ...x }));
  const groups = a => (Array.isArray(a) ? a : []).map(x => Array.isArray(x) ? { members: [...x] } : { ...x, members: [...(x.members || [])] });
  r.forbidden = pairs(raw.forbidden); r.forced = pairs(raw.forced);
  r.couples = groups(raw.couples); r.groups = groups(raw.groups);
  r.history = raw.history && typeof raw.history === "object" ? { ...raw.history } : null;
  r.settings = { ...(raw.settings || {}) };
  return r;
}
function serializeRules(r) {
  const clean = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== ""));
  const compact = o => { const c = clean(o); return Object.keys(c).length === 1 ? c.members : c; };
  const out = { ...r.extra };
  if (r.forbidden.length) out.forbidden = r.forbidden.map(clean);
  if (r.forced.length) out.forced = r.forced.map(clean);
  if (r.couples.length) out.couples = r.couples.map(compact);
  if (r.groups.length) out.groups = r.groups.map(compact);
  if (r.history) out.history = clean(r.history);
  const st = clean(r.settings); if (Object.keys(st).length) out.settings = st;
  return out;
}
/** What goes to the server. The id (never shown) is what keeps a person recognisable across renames. */
const CHANNELS = [["email", "E-mail"], ["phone", "SMS"], ["messenger", "Messenger"], ["other", "Autre"]];
const CHANNEL_NAME = { email: "e-mail", phone: "SMS", messenger: "Messenger", other: "autre moyen", none: "aucun contact" };
/** The ways to reach someone, as sent to the server: only what is filled in. */
const serPeople = () => S.participants.map(p => {
  const o = { ...(p.id ? { id: p.id } : {}), name: p.name.trim() };
  for (const [c] of CHANNELS) if (p[c].trim()) o[c] = p[c].trim();
  if (p.prefer && p[p.prefer] && p[p.prefer].trim()) o.prefer = p.prefer;
  return o;
});
const emptyPerson = (extra = {}) => ({ name: "", email: "", phone: "", messenger: "", other: "", prefer: "", prev: "", ...extra });
const fromServer = p => emptyPerson({ id: p.id || undefined, name: p.name || "", email: p.email || "", phone: p.phone || "", messenger: p.messenger || "",
  other: p.other || "", prefer: p.prefer || "", prev: p.name || "", more: !!(p.phone || p.messenger || p.other) });
const contactsOf = p => CHANNELS.filter(([c]) => p[c].trim()).map(([c]) => c);
const normTemplate = t => t.replace(/\r\n/g, "\n").replace(/\n+$/, "") + "\n";
const snap = () => ({ p: JSON.stringify(serPeople()), r: JSON.stringify(serializeRules(S.rules)), t: normTemplate(S.template) });
function dirtyParts() { const n = snap(); return { p: n.p !== S.saved.p, r: n.r !== S.saved.r, t: n.t !== S.saved.t }; }
const isDirty = () => Object.values(dirtyParts()).some(Boolean);
const names = () => S.participants.map(p => p.name.trim()).filter(Boolean);

/* ================================================================
   Loading, saving, validating
================================================================ */
async function load() {
  const epoch = S.epoch, st = await api("/api/state");
  if (epoch !== S.epoch) return;
  if (st._status === 404 && st.code === "no_set") { await refreshSets(); await pickInitialSet(); return; }
  if (!st.ok) { $("#panel").replaceChildren(h("div", { class: "err-box" }, st.error || "Impossible de charger l'état.")); return; }
  S.participants = st.participants.map(fromServer);
  S.rules = normalizeRules(st.rules);
  S.template = st.template.text; S.templateExists = st.template.exists;
  S.history = st.history; S.year = st.year;
  S.defaults = st.defaults;
  S.saved = snap();
  const fromHash = location.hash.slice(1);
  S.tab = TABS.some(t => t[0] === fromHash) ? fromHash : (S.participants.length ? "rules" : "participants");
  S.validation = null; S.preview = null;
  if (st.upgraded) toast("Cet ensemble vient d'être mis à jour" + (st.upgraded.ids_added ? " : identifiants ajoutés aux participants" : "") + (st.upgraded.history_converted.length ? ", historique converti" : "") + ". Les anciennes versions sont conservées en .bak.");
  renderAll();
  runValidate();
}

async function save() {
  // Ctrl+S inside a name field: commit the pending rename (it fires on blur) so the rules follow before we validate.
  const focused = document.activeElement;
  if (focused && focused.closest && focused.closest(".prow")) focused.blur();
  const d = dirtyParts();
  if (!(d.p || d.r || d.t)) return;
  const body = { year: S.year };
  if (d.p) body.participants = serPeople();
  if (d.r) body.rules = serializeRules(S.rules);
  if (d.t) body.template = S.template;
  const res = await api("/api/save", body);
  if (!res.ok) { toast(res.error || "L'enregistrement a échoué.", "error"); return; }
  if (d.p) S.participants.forEach((p, i) => { const sp = res.state.participants[i]; if (sp && sp.id) p.id = sp.id; });   // new rows received their id
  const now = snap();
  if (d.p) S.saved.p = now.p; if (d.r) S.saved.r = now.r; if (d.t) { S.saved.t = now.t; S.templateExists = true; }
  S.history = res.state.history;
  const labels = { "participants.json": "participants", "rules.json": "règles", "message.txt": "message" };
  toast("Enregistré : " + res.saved.map(f => labels[f] || f).join(", ") + ".", "good");
  renderAll(); runValidate();
}

let validateSeq = 0;
const scheduleValidate = debounce(() => runValidate(), 350);
async function runValidate() {
  const seq = ++validateSeq, epoch = S.epoch;
  const res = await api("/api/validate", { participants: serPeople(), rules: serializeRules(S.rules), year: S.year });
  if (seq !== validateSeq || epoch !== S.epoch) return;   // a newer request, or another set, took over
  S.validation = res.errors ? res : { ok: false, errors: [res.error || "Vérification impossible."], notes: [], infos: [], violations: [], summary: [], hard: 0, soft: 0, feasible: null };
  renderHeader();
  if (S.tab === "rules") renderVerdictInto($("#verdict"));
}

/** Called after any edit: refresh dirty markers without rebuilding the panel. */
function afterEdit() { renderHeader(); }

/* ================================================================
   Header
================================================================ */
function verdictTone() {
  const v = S.validation;
  if (!v) return { tone: "idle", text: "Vérification…" };
  if (!v.ok) return { tone: "bad", text: "Règles à corriger" };
  if (v.feasible === false) return { tone: "bad", text: "Aucun tirage possible" };
  if (v.violations.length) return { tone: "warn", text: "Possible, avec concessions" };
  return { tone: "good", text: "Règles valides" };
}
function renderHeader() {
  const d = dirtyParts(), dirty = d.p || d.r || d.t;
  const flags = S.setId ? { participants: d.p, rules: d.r, message: d.t } : {};
  renderSetSwitcher();
  $("#tabs").replaceChildren(...TABS.map(([id, label]) => h("button", {
    class: "tab", role: "tab", id: "tab-" + id, "aria-selected": String(S.tab === id && !!S.setId), disabled: !S.setId, onclick: () => go(id),
  }, label, flags[id] ? h("span", { class: "dot", title: "Modifications non enregistrées", role: "img", "aria-label": "modifications non enregistrées" }) : null)));
  const v = verdictTone();
  if (!S.setId) { $("#status").replaceChildren(); return; }
  $("#status").replaceChildren(...[
    h("button", { class: "pill " + v.tone, onclick: () => go("rules"), title: "Voir le détail dans Règles" }, v.text),
    dirty ? null : h("span", { class: "saved-note" }, "Tout est enregistré"),
    dirty ? h("button", { class: "btn primary", onclick: save, title: "Ctrl+S" }, "Enregistrer") : null,
  ].filter(Boolean));
}
function go(tab) {
  S.tab = tab; history.replaceState(null, "", "#" + tab);
  renderAll();
  if (tab === "message") refreshPreview();
  if (tab === "send") refreshDeliveries();
}
function renderAll() { renderHeader(); renderPanel(); }
function renderPanel() {
  const p = $("#panel"); p.replaceChildren();
  if (!S.setId) return renderWelcome(p);
  ({ participants: renderParticipants, rules: renderRules, sim: renderSim, message: renderMessage, draw: renderDraw, send: renderSend })[S.tab](p);
}
const pageHead = (title, sub) => h("div", { class: "page-head" }, h("h2", {}, title), h("p", {}, sub));
/** A small "?" that explains something on hover or keyboard focus (and on tap). */
let tipSeq = 0;
function tip(text) {
  const id = "tip" + ++tipSeq;
  const box = h("span", { class: "tipbox", role: "tooltip", id }, text);
  const btn = h("button", { type: "button", class: "qm", "aria-label": "Explication", "aria-describedby": id,
    onclick: e => { e.preventDefault(); e.currentTarget.parentNode.classList.toggle("open"); },
    onkeydown: e => { if (e.key === "Escape") e.currentTarget.parentNode.classList.remove("open"); } }, "?");
  return h("span", { class: "tip" }, btn, box);
}
document.addEventListener("click", e => { document.querySelectorAll(".tip.open").forEach(t => { if (!t.contains(e.target)) t.classList.remove("open"); }); });

/* ================================================================
   Participants
================================================================ */
function personErrors() {
  const seen = new Set();
  return S.participants.map(p => {
    const e = [], n = p.name.trim();
    if (!n) e.push("Le nom est vide.");
    else {
      if (/[\\\/\x00-\x1f]/.test(n) || n.startsWith(".")) e.push("Pas de « / » ni de « \\ », et pas de point au début : le nom sert aussi de nom de fichier.");
      if (seen.has(n)) e.push("Ce nom existe déjà : chaque nom doit être unique."); else seen.add(n);
    }
    if (p.email.trim() && !/^[^@\s-][^@\s]*@[^@\s]+$/.test(p.email.trim())) e.push("Adresse e-mail invalide.");
    const ph = p.phone.trim();
    if (ph && !(/^\+?[0-9][0-9 .()\/-]*$/.test(ph) && (ph.match(/[0-9]/g) || []).length >= 6)) e.push("Numéro de téléphone invalide.");
    return e;
  });
}
function refreshRowErrors() {
  const errs = personErrors();
  document.querySelectorAll(".prow").forEach((row, i) => {
    const box = row.querySelector(".rowerr");
    box.textContent = (errs[i] || []).join(" "); box.classList.toggle("on", !!(errs[i] || []).length);
    const [n, m] = row.querySelectorAll("input");
    n.classList.toggle("bad", !S.participants[i].name.trim() || (errs[i] || []).some(x => /nom/i.test(x)));
    m.classList.toggle("bad", (errs[i] || []).some(x => /e-mail/.test(x)));
    const tel = row.querySelector('[data-f="phone"]'); if (tel) tel.classList.toggle("bad", (errs[i] || []).some(x => /téléphone/.test(x)));
  });
}
function renderParticipants(panel) {
  panel.append(pageHead("Participants", "Les personnes qui offrent et reçoivent un cadeau. Chaque nom est unique : les règles s'y réfèrent."));
  const box = h("div", { class: "people" });
  box.append(h("div", { class: "count" }, `${S.participants.length} personne${s(S.participants.length)}`));
  const lost = S.participants.filter(p => p.name.trim() && !contactsOf(p).length).length;
  if (lost) box.append(h("p", { class: "nocontact" }, `${plural(lost, "personne n'a", "personnes n'ont")} aucun moyen de contact. Le tirage reste possible ; leur message sera à remettre en main propre.`));
  S.participants.forEach((p, i) => {
    const extras = contactsOf(p).filter(c => c !== "email").map(c => CHANNEL_NAME[c]);
    const none = !contactsOf(p).length;
    const field = (key, props) => h("input", { class: "in", value: p[key], "data-f": key, autocomplete: "off", ...props,
      oninput: e => { p[key] = e.target.value; afterEdit(); refreshRowErrors(); if (key !== "name") syncPrefer(p, row); },
      onchange: () => key === "name" ? commitName(p) : scheduleValidate() });
    const row = h("div", { class: "prow" },
      field("name", { placeholder: "Nom", "aria-label": `Nom du participant ${i + 1}` }),
      field("email", { type: "email", placeholder: "adresse@exemple.org (facultatif)", "aria-label": `E-mail du participant ${i + 1}` }),
      h("button", { class: "btn ghost small more" + (none ? " warn" : ""), "aria-expanded": String(!!p.more), onclick: () => { p.more = !p.more; renderPanel(); },
        title: "Téléphone, Messenger, autre moyen de contact" }, none ? "Aucun contact" : extras.length ? extras.join(" · ") : "Autres moyens"),
      h("button", { class: "btn ghost danger", onclick: () => removePerson(i), "aria-label": `Retirer ${p.name || "ce participant"}` }, "Retirer"),
      p.more ? h("div", { class: "pmore" },
        h("label", { class: "field" }, "Téléphone (SMS, WhatsApp…)", field("phone", { type: "tel", placeholder: "+33 6 12 34 56 78", "aria-label": `Téléphone du participant ${i + 1}` })),
        h("label", { class: "field" }, "Messenger", field("messenger", { placeholder: "nom d'utilisateur ou lien", "aria-label": `Messenger du participant ${i + 1}` })),
        h("label", { class: "field" }, "Autre moyen", field("other", { placeholder: "ex. lui donner au déjeuner", "aria-label": `Autre moyen pour le participant ${i + 1}` })),
        h("label", { class: "field prefer" }, "Moyen à utiliser", preferSelect(p))) : null,
      h("div", { class: "rowerr", role: "alert" }));
    box.append(row);
  });
  if (!S.participants.length) box.append(h("p", { class: "empty" }, "Personne pour l'instant. Ajoutez au moins deux participants, ou collez une liste « Nom, e-mail ou téléphone »."));
  box.append(h("div", { class: "people-actions" },
    h("button", { class: "btn line", onclick: addPerson }, "Ajouter une personne"),
    h("button", { class: "btn line", onclick: pasteDialog }, "Coller une liste"),
  ));
  panel.append(box);
  refreshRowErrors();
}
/** "Which one to use" only matters with two contacts or more; keep the select in step with the fields. */
function preferSelect(p) {
  const have = contactsOf(p);
  if (p.prefer && !have.includes(p.prefer)) p.prefer = "";
  const sel = h("select", { class: "in", "aria-label": "Moyen à utiliser", disabled: have.length < 2,
    onchange: e => { p.prefer = e.target.value; afterEdit(); scheduleValidate(); } },
    h("option", { value: "" }, have.length < 2 ? "Le seul renseigné" : "Premier de la liste (e-mail d'abord)"),
    ...CHANNELS.filter(([c]) => have.includes(c)).map(([c, label]) => h("option", { value: c, selected: p.prefer === c }, label)));
  return sel;
}
function syncPrefer(p, row) {
  const old = row.querySelector(".prefer select"); if (!old) return;
  old.replaceWith(preferSelect(p));
  const b = row.querySelector(".more"); if (b) { const have = contactsOf(p), ex = have.filter(c => c !== "email").map(c => CHANNEL_NAME[c]); b.textContent = !have.length ? "Aucun contact" : ex.length ? ex.join(" · ") : "Autres moyens"; b.classList.toggle("warn", !have.length); }
}
function addPerson() {
  S.participants.push(emptyPerson());
  renderPanel(); afterEdit();
  const rows = document.querySelectorAll(".prow"); rows[rows.length - 1].querySelector("input").focus();
}
/** After a name is edited: carry the rename into the rules that mention it. */
function commitName(p) {
  const old = p.prev, now = p.name.trim();
  if (old && now && old !== now) {
    const n = renameInRules(old, now);
    if (n) toast(`« ${old} » devient « ${now} » dans ${n} règle${s(n)}.`);
  }
  p.prev = now;
  afterEdit(); scheduleValidate();
}
function eachRule(fn) {
  S.rules.forbidden.forEach(r => fn("pair", r)); S.rules.forced.forEach(r => fn("pair", r));
  S.rules.couples.forEach(r => fn("members", r)); S.rules.groups.forEach(r => fn("members", r));
}
function renameInRules(old, now) {
  let n = 0;
  eachRule((kind, r) => {
    if (kind === "pair") { let hit = false; if (r.from === old) { r.from = now; hit = true; } if (r.to === old) { r.to = now; hit = true; } n += hit; }
    else if (r.members.includes(old)) { r.members = r.members.map(m => m === old ? now : m); n++; }
  });
  return n;
}
function rulesMentioning(name) {

    const t0 = performance.now();
    const res = await api("/api/simulate", { participants: serPeople(), rules: serializeRules(S.rules), year: S.year, runs: want });
    if (epoch !== S.epoch) return;              // another set was opened meanwhile
    if (!res.ok) { sim.error = res.error; break; }
    if (!sim.agg) sim.agg = newAgg(res);
    const a = sim.agg;
    if (res.infeasible) { a.infeasible = true; break; }
    res.counts.forEach((row, i) => row.forEach((c, j) => { a.counts[i][j] += c; }));

async function sendAll(ch) {
  const todo = sendCounts().auto(ch), kind = AUTO[ch];
  const ok = await confirmDialog({ title: `Envoyer ${plural(todo.length, kind.one, kind.many)} ?`, label: "Envoyer",
    text: ch === "phone" ? "Chaque personne reçoit son message par SMS, depuis le téléphone réglé. Un message envoyé est noté dans delivery/ : relancer l'envoi ne le renverra pas, et un échec peut être réessayé."
                         : "Chaque personne reçoit son message. Un e-mail envoyé est noté dans delivery/ : relancer l'envoi ne le renverra pas, et un échec peut être réessayé." });
  if (!ok) return;
  const epoch = S.epoch; S.send.busy = true; S.send.stop = false; let sent = 0, failed = 0;
  for (const d of todo) {
    if (S.send.stop || epoch !== S.epoch) break;
    if (await sendOne(d)) sent++; else failed++;
  }
  if (epoch !== S.epoch) return;
  const stopped = S.send.stop; S.send.busy = false; S.send.stop = false; S.send.now = null; renderAll();
  toast(`${plural(sent, kind.one + " envoyé", kind.many + " envoyés")}` + (failed ? `, ${plural(failed, "échec", "échecs")} (survolez « Échec » ou lisez le détail dans la liste)` : "") + (stopped ? ". Envoi arrêté." : "."), failed ? "error" : "good");
}
/** Settings of the SMSGate phone. Shared by every set: it is the phone of the person running the tool. */
async function smsSettings() {
  const cur = await api("/api/sms");
  if (!cur.ok) return toast(cur.error || "Impossible de lire les réglages SMS.", "error");
  const f = (label, props, hint) => h("label", { class: "field" }, label, h("input", { class: "in", autocomplete: "off", spellcheck: false, ...props }), hint ? h("span", { class: "help" }, hint) : null);
  const url = f("Adresse du téléphone", { value: cur.url, placeholder: "http://192.168.1.42:8080" }, "Affichée dans l'appli SMSGate, serveur local activé. Le téléphone et cet ordinateur doivent être sur le même réseau.");
  const user = f("Identifiant", { value: cur.username });
  const pass = f("Mot de passe", { type: "password", value: "", placeholder: cur.has_password ? "(inchangé)" : "" });
  const cc = f("Indicatif pays", { value: cur.country_code, placeholder: "+33" }, "Pour transformer 06 12 34 56 78 en +33 6 12 34 56 78. Vide : les numéros sont envoyés tels quels.");
  const err = h("div", { class: "dlg-err", role: "alert" }), ok = h("div", { class: "help", role: "status" });
  const form = () => ({ url: url.querySelector("input").value, username: user.querySelector("input").value, password: pass.querySelector("input").value, country_code: cc.querySelector("input").value });
  await openDialog({
    title: "Réglages SMS (SMSGate)", wide: true,
    content: h("div", { class: "form-grid" },
      h("p", { class: "help" }, "L'appli libre SMSGate (Android) envoie les SMS avec la carte SIM du téléphone, ici sous le contrôle de cet ordinateur. Le texte du message, qui nomme la personne tirée, circule en clair entre cet ordinateur et le téléphone : à faire sur un réseau de confiance. Laisser tout vide efface les réglages."),
      url, user, pass, cc, err, ok),
    actions: [
      { label: "Annuler", value: false },
      { label: "Tester", onClick: async () => { err.textContent = ""; ok.textContent = "Test…"; const r = await api("/api/sms/test", form()); ok.textContent = r.ok ? "Le téléphone répond." : ""; if (!r.ok) err.textContent = r.error; return false; } },
      { label: "Enregistrer", kind: "primary", value: true, onClick: async () => {
        const r = await api("/api/sms/save", form());
        if (!r.ok) { ok.textContent = ""; err.textContent = r.error; return false; }
      } }],
  });
  await refreshDeliveries();
}

/* ================================================================
   Sets: several participant lists, each with its own rules, message and history
================================================================ */
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const setMeta = x => {
  const r = x.rules, bits = [plural(x.participants, "personne", "personnes")];
  const n = r.couples + r.groups + r.forbidden + r.forced + (r.history ? 1 : 0);
  bits.push(n ? plural(n, "règle", "règles") : "aucune règle");
  if (x.history_years.length) bits.push("tirage" + s(x.history_years.length) + " " + x.history_years.slice(-3).join(", "));
  return bits.join(" · ");
};
const storeGet = () => { try { return localStorage.getItem("santa.set"); } catch { return null; } };
const storeSet = v => { try { v ? localStorage.setItem("santa.set", v) : localStorage.removeItem("santa.set"); } catch { /* private mode: not essential */ } };
const curSet = () => S.sets.find(x => x.id === S.setId);

async function refreshSets() {
  const res = await api("/api/sets");
  if (res.ok) { S.sets = res.sets; S.root = res.root; }
  return res;
}
async function boot() {
  const res = await refreshSets();
  if (!res.ok) { $("#panel").replaceChildren(h("div", { class: "err-box" }, res.error || "Impossible de charger les ensembles.")); return; }
  await pickInitialSet();
}
async function pickInitialSet() {
  const want = storeGet(), id = S.sets.some(x => x.id === want) ? want : (S.sets[0] && S.sets[0].id) || null;
  S.setId = id; S.epoch++; storeSet(id);
  if (!id) { renderAll(); return; }
  await load();
}

/** Open another set, guarding unsaved edits and running work. */
async function switchSet(id) {
  closeMenu();
  if (id === S.setId) return true;
  if (S.sim.running) S.sim.stop = true;
  if (S.draw.busy) { toast("Un tirage est en cours : attendez la fin avant de changer d'ensemble.", "error"); return false; }
  if (S.send.busy) { toast("Un envoi est en cours : attendez la fin, ou arrêtez-le, avant de changer d'ensemble.", "error"); return false; }
  if (S.setId && isDirty()) {
    const choice = await openDialog({
      title: "Modifications non enregistrées",
      content: h("p", {}, `Des changements dans « ${curSet() ? curSet().name : "cet ensemble"} » ne sont pas enregistrés.`),
      actions: [{ label: "Rester ici", value: "stay" }, { label: "Abandonner", kind: "danger", value: "discard" }, { label: "Enregistrer puis changer", kind: "primary", value: "save" }],
    });
    if (choice !== "discard" && choice !== "save") return false;
    if (choice === "save") { await save(); if (isDirty()) return false; }   // save() reports why it failed
  }
  S.setId = id; S.epoch++; storeSet(id);
  S.sim = { running: false, stop: false, total: S.sim.total, agg: null, error: null };
  S.draw = { busy: false, lines: null, kind: null, ok: null };
  S.send = { busy: false, stop: false, items: null, mailReady: true, errors: {}, now: null };
  history.replaceState(null, "", location.pathname);
  await load();
  return true;
}

/* ---------- switcher in the header ---------- */
let menuEl = null, switcherSig = "";
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; document.querySelectorAll(".setbtn").forEach(b => b.setAttribute("aria-expanded", "false")); } }
function renderSetSwitcher() {
  const wrap = $("#setwrap"); if (!wrap) return;
  const cur = curSet(), sig = JSON.stringify([S.setId, cur && cur.name, cur && cur.path]);
  if (sig === switcherSig && wrap.firstChild) return;   // header re-renders on every edit: keep an open menu open
  switcherSig = sig; closeMenu();
  // Tabler icon "chevron-down" (tabler.io/icons), inlined so the page stays self-contained.
  const chevron = () => { const n = document.createElementNS("http://www.w3.org/2000/svg", "svg"); n.setAttribute("width", "16"); n.setAttribute("height", "16"); n.setAttribute("viewBox", "0 0 24 24"); n.setAttribute("aria-hidden", "true");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", "M6 9l6 6l6 -6"); p.setAttribute("fill", "none"); p.setAttribute("stroke", "currentColor"); p.setAttribute("stroke-width", "2"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); n.append(p); return n; };
  wrap.replaceChildren(h("button", { class: "setbtn", "aria-haspopup": "menu", "aria-expanded": "false", title: cur ? cur.path : "", onclick: toggleMenu },
    h("span", { class: "t" }, h("span", { class: "k" }, "Ensemble"), h("span", { class: "v" }, cur ? cur.name : "Aucun")), chevron()));
}
function toggleMenu() {
  if (menuEl) return closeMenu();
  const btn = $(".setbtn"); btn.setAttribute("aria-expanded", "true");
  menuEl = h("div", { class: "menu", role: "menu", "aria-label": "Ensembles" },
    ...S.sets.map(x => h("button", { class: "mi", role: "menuitemradio", "aria-checked": String(x.id === S.setId), onclick: () => switchSet(x.id) },
      h("span", { class: "ck", "aria-hidden": "true" }, x.id === S.setId ? "✓" : ""), h("span", { class: "nm" }, x.name), h("span", { class: "meta" }, setMeta(x)))),
    S.sets.length ? h("hr") : null,
    h("button", { class: "mi act", role: "menuitem", onclick: () => { closeMenu(); newSetDialog(); } }, "Nouvel ensemble…"),
    h("button", { class: "mi act", role: "menuitem", onclick: () => { closeMenu(); manageDialog(); } }, "Gérer les ensembles…"));
  $("#setwrap").append(menuEl);
  const items = [...menuEl.querySelectorAll(".mi")];
  (items.find(i => i.getAttribute("aria-checked") === "true") || items[0]).focus();
  menuEl.addEventListener("keydown", e => {
    const i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === "Escape") { e.stopPropagation(); closeMenu(); btn.focus(); }
  });
}
document.addEventListener("click", e => { if (menuEl && !e.target.closest("#setwrap")) closeMenu(); });

/* ---------- create / copy ---------- */
async function newSetDialog({ from = null, suggest = "" } = {}) {
  const name = h("input", { class: "in", type: "text", maxlength: 60, value: suggest, placeholder: "Famille, Bureau, Amis du lycée…", autocomplete: "off", "aria-label": "Nom de l'ensemble" });
  const err = h("div", { class: "dlg-err", role: "alert" });
  let source = from;
  const copyMsg = h("input", { type: "checkbox", checked: true }), copyHist = h("input", { type: "checkbox" });
  const opts = h("div", { class: "form-grid" });
  const redraw = () => {
    opts.replaceChildren(
      h("label", { class: "field" }, "Point de départ",
        h("select", { class: "in", onchange: e => { source = e.target.value || null; redraw(); } },
          h("option", { value: "" }, "Un ensemble vide"),
          ...S.sets.map(x => h("option", { value: x.id, selected: x.id === source }, "Copie de « " + x.name + " »")))),
      source ? h("div", { class: "form-grid" },
        h("p", { class: "help" }, "Les participants et les règles sont copiés. Ensuite, les deux ensembles évoluent séparément."),
        h("label", { class: "radio-line" }, copyMsg, h("span", {}, "Copier aussi le message")),
        h("label", { class: "radio-line" }, copyHist, h("span", {}, h("span", {}, "Copier aussi l'historique des tirages "), h("span", { class: "help" }, "(pour tester une variante des mêmes personnes)")))) : null);
  };
  redraw();
  const done = await openDialog({
    title: "Nouvel ensemble",
    content: h("div", { class: "form-grid" }, h("label", { class: "field" }, "Nom", name), opts, err),
    actions: [{ label: "Annuler", value: false }, { label: "Créer et ouvrir", kind: "primary", value: true, onClick: async () => {
      const res = await api("/api/sets/create", { name: name.value, from: source, copy_message: copyMsg.checked, copy_history: copyHist.checked });
      if (!res.ok) { err.textContent = res.error; return false; }
      S.sets = res.sets; S.pendingOpen = res.id;
    } }],
  });
  if (done === true && S.pendingOpen) { const id = S.pendingOpen; S.pendingOpen = null; await switchSet(id); toast(`Ensemble « ${id} » créé.`, "good"); }
  return done;
}
async function renameSetDialog(x) {
  const name = h("input", { class: "in", type: "text", maxlength: 60, value: x.name, "aria-label": "Nouveau nom" });
  const err = h("div", { class: "dlg-err", role: "alert" });
  return openDialog({
    title: `Renommer « ${x.name} »`,
    content: h("div", { class: "form-grid" }, h("label", { class: "field" }, "Nom", name), err),
    actions: [{ label: "Annuler", value: false }, { label: "Renommer", kind: "primary", value: true, onClick: async () => {
      const res = await api("/api/sets/rename", { id: x.id, name: name.value });
      if (!res.ok) { err.textContent = res.error; return false; }
      S.sets = res.sets; if (S.setId === x.id) { S.setId = res.id; storeSet(res.id); }
    } }],
  });
}
async function deleteSetDialog(x) {
  const ok = await confirmDialog({ title: `Supprimer « ${x.name} » ?`, label: "Supprimer", danger: true,
    text: "L'ensemble disparaît de la liste. Son dossier est déplacé dans sets/.trash : rien n'est effacé, vous pouvez le remettre à la main." });
  if (!ok) return false;
  const res = await api("/api/sets/delete", { id: x.id });
  if (!res.ok) { toast(res.error, "error"); return false; }
  S.sets = res.sets; toast(`« ${x.name} » supprimé.`);
  if (S.setId === x.id) { S.setId = null; S.epoch++; await pickInitialSet(); }
  return true;
}

/* ---------- manager dialog ---------- */
function manageDialog() {
  const list = h("div", { class: "setlist" });
  const draw = () => {
    list.replaceChildren(...(S.sets.length ? S.sets.map(x => h("div", { class: "srow" },
      h("div", { class: "who" }, h("b", { title: x.path }, x.name), h("span", {}, setMeta(x))),
      x.id === S.setId ? h("span", { class: "cur" }, "ouvert") : null,
      h("div", { class: "acts" },
        x.id === S.setId ? null : h("button", { class: "btn ghost small", onclick: async () => { if (await switchSet(x.id)) dlgClose(); } }, "Ouvrir"),
        h("button", { class: "btn ghost small", onclick: async () => { if ((await newSetDialog({ from: x.id, suggest: x.name + " (copie)" })) === true) dlgClose(); } }, "Dupliquer"),
        x.legacy ? null : h("button", { class: "btn ghost small", onclick: async () => { await renameSetDialog(x); draw(); renderHeader(); } }, "Renommer"),
        x.legacy ? null : h("button", { class: "btn ghost danger small", onclick: async () => { if (await deleteSetDialog(x)) { draw(); renderAll(); } } }, "Supprimer")))) : [h("p", { class: "empty" }, "Aucun ensemble pour l'instant.")]));
  };
  let dlgClose = () => {};
  draw();
  const root = h("p", { class: "help", title: S.root ? S.root + "/sets" : "" }, "Chaque ensemble est un dossier de sets/ : participants, règles, message et historique restent ensemble.");
  const p = openDialog({ title: "Ensembles", wide: true, content: h("div", { class: "form-grid" }, root, list),
    actions: [{ label: "Nouvel ensemble…", kind: "line", value: "new", onClick: () => { setTimeout(() => newSetDialog(), 0); return true; } }, { label: "Fermer", kind: "primary", value: true }] });
  dlgClose = () => { const d = document.querySelector("dialog[open]"); if (d) d.close(); };
  return p;
}

/* ---------- first run ---------- */
function renderWelcome(p) {
  const name = h("input", { class: "in", type: "text", maxlength: 60, placeholder: "Famille, Bureau, Amis du lycée…", autocomplete: "off", "aria-label": "Nom du premier ensemble" });
  const err = h("div", { class: "dlg-err", role: "alert" });
  const create = async () => {
    const res = await api("/api/sets/create", { name: name.value });
    if (!res.ok) { err.textContent = res.error; return; }
    S.sets = res.sets; await switchSet(res.id);
  };
  name.addEventListener("keydown", e => { if (e.key === "Enter") create(); });
  p.append(h("div", { class: "welcome" },
    h("h2", {}, "Créons votre premier ensemble"),
    h("p", {}, "Un ensemble réunit une liste de participants et ses règles, son message et son historique. Vous pourrez en avoir autant que de groupes : la famille, le bureau, les amis."),
    h("div", { class: "row" }, name, h("button", { class: "btn primary", onclick: create }, "Créer")), err));
  setTimeout(() => name.focus(), 0);
}

/* ================================================================
   Boot
================================================================ */
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (TABS.some(x => x[0] === t) && t !== S.tab) go(t); });
boot();
</script>
